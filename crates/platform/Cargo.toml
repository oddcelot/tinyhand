[package]
name = "tinyhand-platform"
description = "TinyHand's per-OS code: overlay windows, reading and swallowing the mouse"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
raw-window-handle.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
wayland-client = "0.31"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }

[lints]
workspace = true
