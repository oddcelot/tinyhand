[package]
name = "tinyhand-platform"
description = "TinyHand's per-OS code: overlay windows, reading and swallowing the mouse"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
auto-launch = "0.6.0"
global-hotkey = "0.10.0"
raw-window-handle.workspace = true
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes"] }
wayland-client = "0.31"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell"] }

[lints]
workspace = true
