[package]
name = "tinyhand-overlay"
version = "0.1.0"
edition = "2024"
description = "TinyHand preview for Linux: a hand on a stick that points at things on screen"
license = "MIT"

[dependencies]
# GPUI from Zed's main branch: the crates.io release (0.2.2) has no Wayland layer-shell
# windows, which the Linux overlay needs. Run ./fetch-gpui.sh first; it puts Zed at the
# pinned commit in vendor/zed.
gpui = { path = "vendor/zed/crates/gpui" }
gpui_platform = { path = "vendor/zed/crates/gpui_platform", features = ["runtime_shaders", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
wayland-client = "0.31"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }

# The objc crate's macros check a cfg this crate doesn't declare.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

# Zed patches these for GPUI's dependencies; path dependencies don't carry another
# workspace's patches, so they are repeated here (copied from vendor/zed/Cargo.toml).
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task", rev = "41fd3359c75e221bd8b187a8ee361aa309c1714c" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }

# `cargo deb` builds the Ubuntu package (see linux-test/README.md).
[package.metadata.deb]
name = "tinyhand-preview"
maintainer = "TinyHand contributors"
copyright = "2026 Kamran Ahmed and TinyHand contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
A preview of TinyHand for Linux, built with GPUI. The hand follows the mouse and \
throws fairy dust when you click. While it runs it takes every click; right-click or \
Esc quits. Needs a Wayland compositor with layer shell (KDE, Hyprland, Sway) or X11; \
on GNOME it runs through XWayland."""
section = "utils"
priority = "optional"
# The binary opens these at runtime, so the automatic scan doesn't list them.
depends = "$auto, libwayland-client0, libvulkan1"
recommends = "mesa-vulkan-drivers"
assets = [
    ["target/release/tinyhand-overlay", "usr/bin/", "755"],
    ["../../assets/hand_*.png", "usr/share/tinyhand/hands/", "644"],
    ["packaging/tinyhand-overlay.desktop", "usr/share/applications/", "644"],
    ["packaging/tinyhand-overlay.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]
